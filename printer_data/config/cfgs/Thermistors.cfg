#####################################################################
#   Thermistors
#####################################################################
## External Chamber Thermistor Port
[temperature_sensor Chamber_Gantry]
sensor_type: PT1000
sensor_pin: PA1
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: chamber_th

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor pi_temp]
sensor_type: temperature_host
min_temp: 10
max_temp: 100